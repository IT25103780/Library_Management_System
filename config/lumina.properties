# Local SQL Server connection requested for Lumina Library.
# This is database authentication, not a website account.
db.mode=sqlserver
db.url=jdbc:sqlserver://localhost:1433;databaseName=LuminaLibrary;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=AAKIF

# Demo checkout requires no external account and never charges a card.
# Choose demo, payhere-sandbox, or payhere-live.
payment.mode=demo
payhere.merchant.id=
payhere.merchant.secret=

# Must match the public context URL for real payment callbacks and reset email.
app.url=http://localhost:8080/lumina

# Optional absolute storage folder. Forward slashes are recommended on Windows.
# By default: CATALINA_BASE/lumina-data (outside the deployed WAR).
# storage.path=C:/LuminaData

# Initial password for seeded website accounts. Only used on first initialization.
bootstrap.password=Lumina@2026!

# Configure all fields to enable email. In-app notifications work independently.
smtp.host=
smtp.port=587
smtp.user=
smtp.password=
smtp.from=
